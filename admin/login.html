<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Nexora</title>
  <link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      background:
        radial-gradient(ellipse 70% 60% at 60% 45%, rgba(140,106,204,0.35) 0%, transparent 65%),
        radial-gradient(ellipse 45% 50% at 15% 50%, rgba(80,45,140,0.30) 0%, transparent 55%),
        #06152b;
      color: #0a2540;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.06;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 200px;
      mix-blend-mode: overlay;
    }
    .login-card {
      position: relative;
      z-index: 1;
      background: #fff;
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.3), 0 0 0 1px rgba(140,106,204,0.08);
    }
    .login-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 36px;
    }
    .logo-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.12em;
    }
    .logo-text .c { color: #0052cc; }
    .admin-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 8px;
      letter-spacing: 0.15em;
      color: #0052cc;
      border: 1px solid rgba(140,106,204,0.35);
      padding: 3px 10px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #555b78;
      margin-bottom: 8px;
    }
    .form-input {
      width: 100%;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      color: #0a2540;
      background: #f4f2ef;
      border: 1px solid #e2ded7;
      border-radius: 10px;
      padding: 12px 16px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-input:focus {
      border-color: #0052cc;
      box-shadow: 0 0 0 3px rgba(140,106,204,0.12);
    }
    .login-btn {
      width: 100%;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #fff;
      background: #0052cc;
      border: none;
      border-radius: 10px;
      padding: 14px 24px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      margin-top: 8px;
    }
    .login-btn:hover {
      background: #0a2540;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(140,106,204,0.3);
    }
    .login-btn:active { transform: translateY(0); }
    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .error-msg {
      font-size: 13px;
      color: #dc2626;
      text-align: center;
      margin-top: 16px;
      min-height: 20px;
    }
    .login-footer {
      text-align: center;
      margin-top: 32px;
      font-size: 11px;
      color: #555b78;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">
      <span class="logo-text"><span class="c">C</span>ANONIX</span>
      <span class="admin-badge">Admin</span>
    </div>
    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input type="text" class="form-input" id="username" name="username" required autofocus autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" class="form-input" id="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="login-btn" id="login-btn">Sign In</button>
      <div class="error-msg" id="error"></div>
    </form>
    <div class="login-footer">Nexora Admin Panel &middot; Secure Access</div>
  </div>
  <script>
    (function() {
      // If already authenticated, redirect to dashboard
      fetch('/api/auth/check').then(r => r.json()).then(d => {
        if (d.authenticated) window.location.href = '/admin/';
      });

      document.getElementById('login-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('login-btn');
        const err = document.getElementById('error');
        btn.disabled = true;
        btn.textContent = 'Signing in...';
        err.textContent = '';

        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              username: document.getElementById('username').value,
              password: document.getElementById('password').value
            })
          });
          const data = await res.json();
          if (data.success) {
            window.location.href = '/admin/';
          } else {
            err.textContent = data.error || 'Invalid credentials';
            btn.disabled = false;
            btn.textContent = 'Sign In';
          }
        } catch (ex) {
          err.textContent = 'Network error — try again';
          btn.disabled = false;
          btn.textContent = 'Sign In';
        }
      });
    })();
  </script>
</body>
</html>
